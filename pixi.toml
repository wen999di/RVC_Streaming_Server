[workspace]
name = "RVC"
version = "0.1.0"
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]
channel-priority = "disabled"

[workspace.pypi-options]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[dependencies]
python = "3.10.*"
numpy = ">=1.22,<2"
scipy = ">=1.10,<2"
librosa = ">=0.10,<1"
websockets = ">=12,<13"
pytorch = "2.5.1.*"
faiss-gpu = "1.12.0.*"
pip = ">=23,<25"
torchaudio = "2.5.1.*"

[pypi-dependencies]
torchfcpe = ">=0.0.4,<1"

[tasks]
start = "python server.py"