[workspace]
name = "RVC"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]
channel-priority = "disabled"

[workspace.pypi-options]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[dependencies]
python = "3.10.*"
numpy = ">=1.22,<2"
scipy = ">=1.10,<2"
librosa = ">=0.10,<1"
websockets = ">=12,<13"
pip = ">=23,<25"
setuptools = ">=70,<82"

[pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
torchfcpe = ">=0.0.4,<1"

[target.linux-64.pypi-dependencies]
faiss-gpu = ">=1.7,<2"

[target.win-64.dependencies]
faiss-gpu = "1.9.*"

[tasks]
start = "python server.py"
