[workspace]
name = "RVC"
version = "0.1.0"
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

[workspace.pypi-options]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[dependencies]
python = "3.10.*"
numpy = ">=1.22,<2"
scipy = ">=1.10,<2"
librosa = ">=0.10,<1"
websockets = ">=12,<13"
pytorch = "2.5.1.*"
faiss-gpu = ">=1.7,<2"
fairseq = ">=0.12,<1"
pip = ">=23,<25"

[pypi-dependencies]
pyworld = ">=0.3,<1"
praat-parselmouth = ">=0.4,<1"

[tasks]
start = "python server.py"